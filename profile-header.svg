<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">Romário Delphin — Engenharia, Inteligência Artificial e Indústria 4.0</title>
  <desc id="description">Cabeçalho profissional em azul profundo com elementos tecnológicos discretos.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071c30"/>
      <stop offset="0.58" stop-color="#0b3558"/>
      <stop offset="1" stop-color="#0a5262"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fd1c5"/>
      <stop offset="1" stop-color="#e8b84a"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#8edbd5" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="22" fill="url(#background)"/>
  <rect width="1200" height="300" rx="22" fill="url(#grid)"/>
  <circle cx="1090" cy="64" r="118" fill="#4fd1c5" fill-opacity="0.08" filter="url(#glow)"/>
  <circle cx="1050" cy="265" r="95" fill="#e8b84a" fill-opacity="0.09" filter="url(#glow)"/>

  <g fill="none" stroke="#75ded5" stroke-opacity="0.28" stroke-width="2">
    <path d="M910 54h94l24 24h96"/>
    <path d="M950 108h72l26 26h76"/>
    <path d="M910 222h86l22-22h106"/>
    <path d="M980 164h144"/>
    <circle cx="910" cy="54" r="4" fill="#75ded5"/>
    <circle cx="950" cy="108" r="4" fill="#75ded5"/>
    <circle cx="910" cy="222" r="4" fill="#e8b84a" stroke="#e8b84a"/>
    <circle cx="980" cy="164" r="4" fill="#e8b84a" stroke="#e8b84a"/>
  </g>

  <rect x="72" y="58" width="72" height="6" rx="3" fill="url(#accent)"/>
  <text x="72" y="126" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="51" font-weight="700" letter-spacing="1.4">ROMÁRIO DELPHIN</text>
  <text x="74" y="174" fill="#8de1db" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="2.2">ENGENHARIA • INTELIGÊNCIA ARTIFICIAL • INDÚSTRIA 4.0</text>
  <text x="74" y="220" fill="#dce9f2" font-family="Arial, Helvetica, sans-serif" font-size="19" letter-spacing="0.8">Automação  |  Dados  |  Confiabilidade  |  Transformação Digital</text>
  <rect x="72" y="250" width="570" height="2" rx="1" fill="url(#accent)" opacity="0.8"/>
</svg>
