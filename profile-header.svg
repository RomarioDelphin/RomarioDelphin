<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Romário Delphin — IA para o Setor Público</title>
  <desc id="desc">Identidade visual institucional em azul profundo, ciano e dourado.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111A"/>
      <stop offset="0.58" stop-color="#0A2331"/>
      <stop offset="1" stop-color="#0B1822"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#50D7DB"/>
      <stop offset="1" stop-color="#F1D69F"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#50D7DB" stop-opacity=".30"/>
      <stop offset="1" stop-color="#50D7DB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#9CCBD2" stroke-opacity=".08"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="1280" height="360" rx="26" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="26" fill="url(#grid)"/>
  <circle cx="1060" cy="154" r="240" fill="url(#glow)"/>
  <path d="M0 318H1280" stroke="#50D7DB" stroke-opacity=".28"/>
  <rect x="72" y="54" width="64" height="6" rx="3" fill="url(#accent)"/>
  <text x="72" y="142" fill="#F7FAFB" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="800" letter-spacing="1">ROMÁRIO DELPHIN</text>
  <text x="74" y="191" fill="#B5F0EF" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="2.4">INTELIGÊNCIA ARTIFICIAL PARA O SETOR PÚBLICO</text>
  <text x="74" y="241" fill="#9EB0BC" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" letter-spacing="2">AGENTES DE IA  •  SAPL  •  GOVTECH  •  TRANSFORMAÇÃO DIGITAL</text>
  <text x="74" y="302" fill="#F1D69F" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2.2">BRASÍLIA  •  BRASIL</text>
  <g fill="none" stroke-linecap="round">
    <circle cx="1040" cy="156" r="102" stroke="#50D7DB" stroke-opacity=".28"/>
    <circle cx="1040" cy="156" r="70" stroke="#D6AD63" stroke-opacity=".23"/>
    <path d="M932 112L1000 80L1092 102L1157 58" stroke="#50D7DB" stroke-opacity=".58" stroke-width="2"/>
    <path d="M950 245L1005 202L1075 224L1166 184" stroke="#D6AD63" stroke-opacity=".48" stroke-width="2"/>
    <path d="M1000 80L1005 202M1092 102L1075 224" stroke="#9CCBD2" stroke-opacity=".18"/>
  </g>
  <g>
    <circle cx="932" cy="112" r="8" fill="#50D7DB"/>
    <circle cx="1000" cy="80" r="6" fill="#F7FAFB"/>
    <circle cx="1092" cy="102" r="9" fill="#D6AD63"/>
    <circle cx="1157" cy="58" r="5" fill="#50D7DB"/>
    <circle cx="950" cy="245" r="6" fill="#D6AD63"/>
    <circle cx="1005" cy="202" r="9" fill="#50D7DB"/>
    <circle cx="1075" cy="224" r="6" fill="#F7FAFB"/>
    <circle cx="1166" cy="184" r="8" fill="#D6AD63"/>
